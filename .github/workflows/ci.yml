name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, scan and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            application/src/requirements.txt
            application/tests/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r application/src/requirements.txt \
            -r application/tests/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: application/src
        run: python -m pytest -v application/tests

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/sample-app

      - name: Render Helm templates
        run: helm template sample-app helm/sample-app --namespace demo

      - name: Build Docker image
        run: |
          docker build --pull \
            --tag aws-production-platform:ci \
            application/

  publish:
    name: Publish image to Amazon ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-2
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-2.amazonaws.com
      ECR_REPOSITORY: aws-production-platform/sample-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: |
          docker build --pull \
            --tag aws-production-platform:${GITHUB_SHA} \
            application/

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsECRPublish

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker tag \
            "aws-production-platform:${GITHUB_SHA}" \
            "$IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "Published image: $IMAGE_URI"

